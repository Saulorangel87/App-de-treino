      required: [version, mode, captured_at, load_method, load_unit, adherence_basis, completion_time_basis, evidence_keys, windows, missing_data, data_issues, used_for_prescription]
      properties:
        version: { type: string, enum: [training-history-v1, training-history-v2, training-history-v3, training-history-v4, training-history-v5] }
