    Workout:
      type: object
      required: [id, scheduled_on, name, objective, duration_minutes, target_rpe, structure, explanation, status]
      properties:
        id: { type: string, format: uuid }
        scheduled_on: { type: string, format: date }
        name: { type: string }
        objective: { type: string }
        duration_minutes: { type: integer, minimum: 1 }
        target_rpe: { type: number, minimum: 0, maximum: 10 }
        structure: { $ref: '#/components/schemas/WorkoutStructure' }
        explanation: { type: object, additionalProperties: true }
        status: { type: string, enum: [planned, in_progress, completed, skipped, adapted] }
        session:
          oneOf:
            - { $ref: '#/components/schemas/WorkoutSession' }
            - { type: 'null' }
    WorkoutStructure:
      type: object
      required: [warmup_minutes, main, cooldown_minutes]
      properties:
        warmup_minutes: { type: integer, minimum: 1 }
        main: { type: string }
        cooldown_minutes: { type: integer, minimum: 1 }
        protocol_key: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkoutStep' }
      additionalProperties: true
    WorkoutStep:
      type: object
      required: [order, kind, title, duration_minutes, target_rpe, instruction]
      properties:
        order: { type: integer, minimum: 1 }
        kind: { type: string, enum: [warmup, work, recovery, easy, main, cooldown] }
        title: { type: string }
        duration_minutes: { type: integer, minimum: 1 }
        target_rpe: { type: number, minimum: 0, maximum: 10 }
        instruction: { type: string }
    WorkoutSession:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 0 }
        actual_rpe: { type: number, minimum: 1, maximum: 10 }
        distance_km: { type: number, minimum: 0 }
        elevation_gain_m: { type: integer, minimum: 0 }
        average_heart_rate: { type: integer, minimum: 30, maximum: 250 }
        average_power_watts: { type: integer, minimum: 0, maximum: 2000 }
        feedback: { $ref: '#/components/schemas/WorkoutFeedback' }
    WorkoutFeedback:
      type: object
      required: [difficulty, pain_reported, fatigue_after]
      properties:
        difficulty: { type: string, enum: [very_easy, easy, moderate, hard, very_hard] }
        pain_reported: { type: boolean }
        fatigue_after: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, maxLength: 1000 }
    CompleteWorkoutRequest:
      type: object
      required: [actual_rpe, difficulty, pain_reported, fatigue_after]
      properties:
        actual_rpe: { type: number, minimum: 1, maximum: 10 }
        difficulty: { type: string, enum: [very_easy, easy, moderate, hard, very_hard] }
        pain_reported: { type: boolean }
        fatigue_after: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, maxLength: 1000 }
        distance_km: { type: number, minimum: 0, maximum: 2000 }
        elevation_gain_m: { type: integer, minimum: 0, maximum: 20000 }
        average_heart_rate: { type: integer, minimum: 30, maximum: 250 }
        average_power_watts: { type: integer, minimum: 0, maximum: 2000 }
    Activity:
      type: object
      required: [id, workout_id, name, objective, scheduled_on, status]
      properties:
        id: { type: string, format: uuid }
        workout_id: { type: string, format: uuid }
        name: { type: string }
        objective: { type: string }
        scheduled_on: { type: string, format: date }
        status: { type: string, enum: [completed, cancelled] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 0 }
        actual_rpe: { type: number, minimum: 1, maximum: 10 }
        distance_km: { type: number, minimum: 0 }
        elevation_gain_m: { type: integer, minimum: 0 }
        average_heart_rate: { type: integer, minimum: 30, maximum: 250 }
        average_power_watts: { type: integer, minimum: 0, maximum: 2000 }
        feedback: { $ref: '#/components/schemas/WorkoutFeedback' }
