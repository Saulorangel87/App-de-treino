          oneOf:
            - { type: number, minimum: 0, maximum: 100 }
            - { type: 'null' }
        performed_sessions: { type: integer, minimum: 0 }
        performed_minutes: { type: integer, minimum: 0 }
        sessions_with_session_rpe_load: { type: integer, minimum: 0 }
        sessions_without_session_rpe_load: { type: integer, minimum: 0 }
        session_rpe_load: { type: number, minimum: 0 }
        feedback_records: { type: integer, minimum: 0 }
