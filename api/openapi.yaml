openapi: 3.1.0
info:
  title: Cadência API
  version: 0.31.0
  description: API do MVP de planejamento adaptativo de ciclismo.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://cadencia-api.devsaulo.com.br
    description: Produção na VPS Oracle via Cloudflare Tunnel
paths:
  /health:
    get:
      summary: Verifica se o processo da API está ativo
      responses:
        '200': { description: API ativa }
  /ready:
    get:
      summary: Verifica se a API consegue acessar o PostgreSQL
      responses:
        '200': { description: API e banco disponíveis }
        '503': { description: Banco indisponível }
  /v1/auth/register:
    post:
      summary: Cria uma conta e inicia uma sessão
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Conta criada }
        '400': { description: Dados inválidos }
        '409': { description: E-mail já cadastrado }
  /v1/auth/login:
    post:
      summary: Autentica por e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Sessão iniciada }
        '401': { description: Credenciais inválidas }
  /v1/auth/logout:
    post:
      summary: Encerra a sessão atual
      responses:
        '204': { description: Sessão encerrada }
  /v1/auth/account:
    delete:
      summary: Apaga definitivamente a conta e todos os dados pessoais
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password:
                  type: string
                  format: password
                  description: Senha atual da conta
                confirmation:
                  type: string
                  enum: [ENCERRAR CONTA]
                  description: Confirmação explícita exigida pela operação
      responses:
        '204': { description: Conta e dados pessoais apagados }
        '400': { description: Confirmação ou dados inválidos }
        '401': { description: Sessão ausente ou senha incorreta }
        '500': { description: Falha sem alteração dos dados }
  /v1/auth/resend-verification:
    post:
      summary: Reenvia o link de confirmação para o usuário autenticado
      responses:
        '200': { description: Link enviado ou conta já confirmada }
        '401': { description: Sessão ausente ou expirada }
        '503': { description: Serviço de e-mail indisponível }
  /v1/auth/verify-email:
    post:
      summary: Confirma o endereço de e-mail com um token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200': { description: E-mail confirmado }
        '400': { description: Token inválido, expirado ou já usado }
  /v1/auth/forgot-password:
    post:
      summary: Solicita um link de redefinição sem revelar se o e-mail possui conta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '200': { description: Resposta genérica enviada }
        '503': { description: Serviço de e-mail indisponível }
  /v1/auth/reset-password:
    post:
      summary: Redefine a senha com um token de uso único e revoga as sessões existentes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Senha redefinida }
        '400': { description: Senha ou token inválido }
  /v1/me:
    get:
      summary: Retorna o usuário da sessão
      responses:
        '200': { description: Usuário autenticado }
        '401': { description: Sessão ausente ou expirada }
  /v1/profile:
    get:
      summary: Retorna o perfil do atleta autenticado
      responses:
        '200': { description: Perfil encontrado ou nulo quando ainda não preenchido }
        '401': { description: Sessão ausente ou expirada }
    put:
      summary: Cria ou atualiza o perfil básico de ciclismo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AthleteProfile' }
      responses:
        '200': { description: Perfil salvo }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/onboarding:
    get:
      summary: Retorna limitações, objetivos, disponibilidade e contexto de ciclismo do atleta
      responses:
        '200': { description: Dados do onboarding }
        '401': { description: Sessão ausente ou expirada }
        '409': { description: Perfil básico ainda não preenchido }
  /v1/onboarding/questionnaire:
    get:
      summary: Retorna o contrato versionado de etapas e perguntas condicionais do onboarding de ciclismo
      responses:
        '200':
          description: Questionário autenticado disponível
          content:
            application/json:
              schema:
                type: object
                required: [questionnaire]
                properties:
                  questionnaire: { $ref: '#/components/schemas/Questionnaire' }
        '401': { description: Sessão ausente ou expirada }
  /v1/onboarding/limitations:
    put:
      summary: Substitui as limitações ativas informadas pelo atleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limitations]
              properties:
                limitations:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/Limitation' }
      responses:
        '200': { description: Limitações salvas }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/onboarding/goals:
    put:
      summary: Substitui os objetivos principal e secundário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals]
              properties:
                goals:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { $ref: '#/components/schemas/Goal' }
      responses:
        '200': { description: Objetivos salvos }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/onboarding/availability:
    put:
      summary: Substitui a disponibilidade dos sete dias da semana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items: { $ref: '#/components/schemas/Availability' }
      responses:
        '200': { description: Disponibilidade salva }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/onboarding/cycling-context:
    put:
      summary: Salva dados opcionais do contexto de ciclismo do atleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycling_context]
              properties:
                cycling_context: { $ref: '#/components/schemas/CyclingContext' }
      responses:
        '200': { description: Contexto de ciclismo salvo }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/assessments/current:
    get:
      summary: Retorna a avaliação submáxima mais recente do atleta
      responses:
        '200': { description: Avaliação encontrada ou nula }
        '401': { description: Sessão ausente ou expirada }
  /v1/assessments/submaximal:
    post:
      summary: Registra uma avaliação submáxima de ciclismo orientada por RPE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmaxAssessmentRequest' }
      responses:
        '201': { description: Avaliação registrada }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
  /v1/recovery/today:
    get:
      summary: Retorna o check-in do atleta na data local informada
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: Check-in encontrado ou nulo }
        '400': { description: Data inválida }
        '401': { description: Sessão ausente ou expirada }
    put:
      summary: Salva o check-in diário e pode reduzir a próxima sessão ainda não iniciada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryRequest' }
      responses:
        '200': { description: Check-in salvo e eventual adaptação informada }
        '400': { description: Dados inválidos }
        '401': { description: Sessão ausente ou expirada }
        '409': { description: Perfil básico ainda não preenchido }
  /v1/evolution/summary:
    get:
      summary: Retorna indicadores históricos observados, incluindo métricas agregadas de pedal quando registradas
      responses:
        '200':
          description: Totais, semanas, comparação entre sessões planejadas e realizadas, métricas agregadas e check-ins de recuperação
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary: { $ref: '#/components/schemas/EvolutionSummary' }
        '401': { description: Sessão ausente ou expirada }
  /v1/feedback:
    post:
      summary: Registra o relato de experiência do atleta autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserFeedbackRequest' }
      responses:
        '201': { description: Feedback registrado }
        '400': { description: Categoria, nota ou mensagem inválida }
        '401': { description: Sessão ausente ou expirada }
  /v1/plans/generate:
    post:
      summary: Gera e salva um rascunho de quatro semanas usando regras explicáveis
      responses:
        '201': { description: Plano gerado }
        '401': { description: Sessão ausente ou expirada }
        '409': { description: Onboarding incompleto }
        '403': { description: E-mail ainda não confirmado }
  /v1/plans/current:
    get:
      summary: Retorna o plano ativo ou rascunho mais recente
      responses:
        '200': { description: Plano encontrado ou nulo }
        '401': { description: Sessão ausente ou expirada }
  /v1/activities:
    get:
      summary: Retorna atividades concluídas e canceladas do atleta autenticado, da mais recente para a mais antiga
      responses:
        '200': { description: Histórico de atividades }
        '401': { description: Sessão ausente ou expirada }
  /v1/plans/{planID}/activate:
    post:
      summary: Ativa um rascunho e cancela o plano ativo anterior do atleta
      parameters:
        - in: path
          name: planID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Plano ativado }
        '400': { description: Identificador inválido }
        '401': { description: Sessão ausente ou expirada }
        '404': { description: Rascunho não encontrado ou pertencente a outro atleta }
        '403': { description: E-mail ainda não confirmado }
  /v1/workouts/{workoutID}/start:
    post:
      summary: Inicia um treino planejado pertencente ao plano ativo
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      responses:
        '200': { description: Sessão iniciada e plano atualizado }
        '400': { description: Identificador inválido }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano ativo }
        '409': { description: Transição de estado inválida }
  /v1/workouts/{workoutID}/explanation:
    post:
      summary: Gera uma explicação em linguagem simples sem alterar a prescrição do treino
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      responses:
        '200': { description: Explicação gerada ou fallback validado pelas regras quando a IA estiver indisponível }
        '400': { description: Identificador inválido }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano atual }
  /v1/workouts/{workoutID}/complete:
    post:
      summary: Conclui uma sessão em andamento e salva o feedback percebido
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteWorkoutRequest' }
      responses:
        '200': { description: Sessão concluída, feedback salvo e plano atualizado }
        '400': { description: Identificador ou feedback inválido }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano ativo }
        '409': { description: Treino não está em andamento }
  /v1/workouts/{workoutID}/correct:
    post:
      summary: Corrige métricas opcionais de uma sessão concluída inelegível
      description: Substitui distância, elevação, frequência cardíaca e potência opcionais. Null remove a métrica; duração, RPE, feedback e prescrição não são alterados. O valor anterior fica preservado para auditoria.
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutCorrectionRequest' }
      responses:
        '200': { description: Métricas corrigidas, integridade reavaliada e plano preservado }
        '400': { description: Identificador ou métrica inválida }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano do atleta }
        '409': { description: Sessão não concluída ou sem inconsistência corrigível }
  /v1/workouts/{workoutID}/cancel:
    post:
      summary: Cancela uma sessão em andamento e marca o treino como não realizado
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      responses:
        '200': { description: Sessão cancelada e plano atualizado }
        '400': { description: Identificador inválido }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano ativo }
        '409': { description: Treino não está em andamento }
  /v1/workouts/{workoutID}/missed:
    post:
      summary: Marca um treino passado como não realizado sem criar uma sessão
      parameters:
        - $ref: '#/components/parameters/WorkoutID'
      responses:
        '200': { description: Treino marcado como não realizado e plano atualizado }
        '400': { description: Identificador inválido }
        '401': { description: Sessão de usuário ausente ou expirada }
        '404': { description: Treino não encontrado no plano ativo }
        '409': { description: Treino ainda não venceu ou já foi iniciado, concluído ou encerrado }
components:
  parameters:
    WorkoutID:
      in: path
      name: workoutID
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 72 }
        display_name: { type: string, minLength: 2, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 10, maxLength: 72 }
    AthleteProfile:
      type: object
      required: [experience_level]
      properties:
        birth_date: { type: [string, 'null'], format: date }
        sex:
          type: [string, 'null']
          enum: [female, male, other, prefer_not_to_say, null]
        height_cm: { type: [number, 'null'], minimum: 100, maximum: 250 }
        weight_kg: { type: [number, 'null'], minimum: 30, maximum: 350 }
        waist_cm: { type: [number, 'null'], minimum: 30, maximum: 250 }
        body_fat_percent: { type: [number, 'null'], minimum: 2, maximum: 70 }
        weight_trend: { type: string, enum: [not_informed, stable, increasing, decreasing] }
        experience_level: { type: string, enum: [beginner, intermediate, advanced] }
        activity_level: { type: [string, 'null'] }
    Limitation:
      type: object
      required: [kind, description, is_active, professional_clearance_recommended]
      properties:
        kind: { type: string, enum: [pain, injury, medical_condition, mobility, other] }
        description: { type: string, minLength: 3, maxLength: 500 }
        location: { type: string, maxLength: 120 }
        intensity: { type: [integer, 'null'], minimum: 1, maximum: 10, description: Escala percebida opcional; não é diagnóstico. }
        aggravating_movement: { type: string, maxLength: 200 }
        started_on: { type: [string, 'null'], format: date }
        symptoms_during_after:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [dizziness, unusual_shortness_of_breath, malaise, extreme_fatigue, other] }
        medical_restriction: { type: boolean }
        recent_surgery: { type: boolean }
        exercise_prohibited: { type: boolean }
        condition_affecting_exercise: { type: boolean }
        is_active: { type: boolean }
        professional_clearance_recommended: { type: boolean }
    Goal:
      type: object
      required: [goal_type, priority, details]
      properties:
        goal_type: { type: string, enum: [health, fitness, endurance, performance, event, weight_management] }
        priority: { type: integer, minimum: 1, maximum: 2 }
        target_date: { type: [string, 'null'], format: date }
        details: { type: string, maxLength: 500 }
    Availability:
      type: object
      required: [weekday, available_minutes]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        available_minutes: { type: integer, minimum: 0, maximum: 480 }
        preferred_time: { type: [string, 'null'], pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        location: { type: [string, 'null'], maxLength: 80 }
    Questionnaire:
      type: object
      required: [version, scope, steps, questions]
      properties:
        version: { type: string, example: cycling-onboarding-v2 }
        scope: { type: string, example: cycling_profile_and_plan_generation }
        steps:
          type: array
          minItems: 4
          items: { $ref: '#/components/schemas/QuestionnaireStep' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionDefinition' }
    QuestionnaireStep:
      type: object
      required: [id, title, description, question_ids]
      properties:
        id: { type: string, enum: [profile, safety, objective, routine] }
        title: { type: string }
        description: { type: string }
        question_ids:
          type: array
          items: { type: string }
    QuestionDefinition:
      type: object
      required: [id, step, prompt, kind, required]
      properties:
        id: { type: string }
        step: { type: integer, minimum: 1, maximum: 4 }
        prompt: { type: string }
        kind: { type: string, enum: [boolean, choice, date, number, text, time, availability] }
        required: { type: boolean }
        condition:
          $ref: '#/components/schemas/QuestionCondition'
    QuestionCondition:
      type: object
      required: [question_id, equals]
      properties:
        question_id: { type: string }
        equals: {}
    CyclingContext:
      type: object
      required: [weekly_hours, practice_duration_months, average_ride_minutes, longest_ride_minutes, bike_type, terrain, uses_heart_rate, uses_power, uses_gps, uses_sports_watch, uses_smart_trainer, event_goal]
      properties:
        weekly_hours: { type: number, minimum: 0, maximum: 80 }
        practice_duration_months: { type: integer, minimum: 0, maximum: 1200 }
        average_ride_minutes: { type: integer, minimum: 0, maximum: 1440 }
        longest_ride_minutes: { type: integer, minimum: 0, maximum: 1440 }
        weekly_rides: { type: integer, minimum: 0, maximum: 21 }
        recent_weekly_distance_km: { type: number, minimum: 0, maximum: 2000 }
        recent_training_weeks: { type: integer, minimum: 0, maximum: 52 }
        recent_best_distance_km: { type: number, minimum: 0, maximum: 2000 }
        preferred_session_types:
          type: array
          maxItems: 9
          uniqueItems: true
          items: { type: string, enum: [base, cadence, hills, intervals, threshold, sweet_spot, vo2max, short_intervals, recovery] }
        discipline: { type: string, enum: ['', general, road, mtb_xco, mtb_xcm, gravel, indoor] }
        bike_type: { type: string, enum: ['', road, mtb, gravel, indoor] }
        terrain: { type: string, enum: ['', flat, rolling, hilly] }
        uses_heart_rate: { type: boolean }
        uses_power: { type: boolean }
        uses_gps: { type: boolean }
        uses_sports_watch: { type: boolean }
        uses_smart_trainer: { type: boolean }
        ftp: { type: [integer, 'null'], minimum: 50, maximum: 600 }
        ftp_test_date: { type: [string, 'null'], format: date }
        ftp_protocol: { type: [string, 'null'], enum: [20_minute, ramp, other, null] }
        average_power_watts: { type: [integer, 'null'], minimum: 0, maximum: 2000 }
        event_goal: { type: boolean }
        event_distance_km: { type: [integer, 'null'], minimum: 1, maximum: 2000 }
        event_date: { type: [string, 'null'], format: date }
    SubmaxAssessmentRequest:
      type: object
      required: [duration_minutes, actual_rpe, pain_reported]
      properties:
        duration_minutes: { type: integer, minimum: 15, maximum: 30 }
        actual_rpe: { type: number, minimum: 1, maximum: 10 }
        pain_reported: { type: boolean }
        notes: { type: string, maxLength: 1000 }
    RecoveryRequest:
      type: object
      required: [recorded_on, sleep_minutes, sleep_quality, stress_level, fatigue_level]
      properties:
        recorded_on: { type: string, format: date }
        sleep_minutes: { type: integer, minimum: 0, maximum: 1440 }
        sleep_quality: { type: integer, minimum: 1, maximum: 5 }
        stress_level: { type: integer, minimum: 1, maximum: 5 }
        fatigue_level: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, maxLength: 1000 }
    EvolutionSummary:
      type: object
      required: [completed_sessions, cancelled_sessions, total_minutes, average_rpe, average_fatigue, completion_rate, total_distance_km, total_elevation_m, average_power_watts, average_heart_rate, session_rpe_load, average_speed_kph, goal_progress, weeks, recent_sessions, recovery]
      properties:
        completed_sessions: { type: integer, minimum: 0 }
        cancelled_sessions: { type: integer, minimum: 0 }
        total_minutes: { type: integer, minimum: 0 }
        average_rpe: { type: number, minimum: 0, maximum: 10 }
        average_fatigue: { type: number, minimum: 0, maximum: 5 }
        completion_rate: { type: number, minimum: 0, maximum: 100 }
        total_distance_km: { type: number, minimum: 0 }
        total_elevation_m: { type: integer, minimum: 0 }
        average_power_watts: { type: number, minimum: 0 }
        average_heart_rate: { type: number, minimum: 0 }
        session_rpe_load: { type: number, minimum: 0, description: Duração em minutos multiplicada pelo RPE realizado, somente quando ambos foram registrados. }
        average_speed_kph: { type: number, minimum: 0, description: Distância total dividida pelo tempo total registrado; não é estimativa de desempenho. }
        goal_progress:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/GoalProgress' }
        weeks:
          type: array
          items: { $ref: '#/components/schemas/EvolutionWeek' }
        recent_sessions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/SessionComparison' }
        recovery:
          type: array
          items: { $ref: '#/components/schemas/RecoveryPoint' }
    EvolutionWeek:
      type: object
      required: [week_start, completed_sessions, cancelled_sessions, total_minutes, average_rpe, total_distance_km, total_elevation_m, average_power_watts, average_heart_rate, session_rpe_load, average_speed_kph]
      properties:
