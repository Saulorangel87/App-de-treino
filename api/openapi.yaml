          description: Interpretações que os dados ainda não autorizam, incluindo tolerância, destreinamento e progressão.
        used_for_prescription:
          type: boolean
          enum: [false]
    TrainingHistoryWindow:
      type: object
      required: [window_days, expected_sessions, scheduled_completed_sessions, cancelled_sessions, missed_sessions, overdue_in_progress_sessions, completion_rate_percent, performed_sessions, performed_minutes, sessions_with_session_rpe_load, sessions_without_session_rpe_load, session_rpe_load]
