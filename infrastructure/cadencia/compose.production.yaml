name: cadencia

# Rotação de logs: sem isto o json-file do Docker cresce sem limite e pode
# encher o disco da VPS compartilhada.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Endurecimento dos contêineres sem estado (API, frontend e túnel): nenhuma
# capacidade do kernel, sem elevação de privilégio, sistema de arquivos somente
# leitura (só /tmp é gravável, em memória) e limite de processos. O PostgreSQL fica
# de fora porque precisa gravar no volume e trocar de usuário ao iniciar.
x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 256

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - cadencia_postgres_data:/var/lib/postgresql/data
      - ./initdb/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks:
      - cadencia_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["sh", "/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadencia_data
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.api
    restart: unless-stopped
    <<: *hardening
    mem_limit: ${API_MEM_LIMIT:-512m}
    logging: *default-logging
    environment:
      API_PORT: "8080"
      APP_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TOKEN_HOURS: ${EMAIL_TOKEN_HOURS:-24}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen3:4b-instruct}
      AI_WORKER_URL: ${AI_WORKER_URL:-}
      AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-220}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
      PROTECTION_LEVELS_ENABLED: ${PROTECTION_LEVELS_ENABLED:-false}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadencia_edge
      - cadencia_data

  feedback-digest:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.api
    profiles: ["digest"]
    restart: "no"
    entrypoint: ["/usr/local/bin/cadencia-feedback-digest"]
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FEEDBACK_DIGEST_TO: ${FEEDBACK_DIGEST_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      cadencia_data:
        gw_priority: 0
      cadencia_egress:
        gw_priority: 100

  # Cópia completa dos dados de um atleta (LGPD). Roda só quando chamado, pelo
  # perfil "admin"; só lê o banco e não tem rede de saída nem portas publicadas.
  account-export:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.api
    profiles: ["admin"]
    restart: "no"
    <<: *hardening
    entrypoint: ["/usr/local/bin/cadencia-account-export"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      cadencia_data:
        gw_priority: 0

  ollama:
    image: ollama/ollama:latest@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551 # ollama/ollama:latest em 2026-09-26; atualize com o Dependabot
    restart: unless-stopped
    mem_limit: 4g
    cpus: "1.0"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    expose:
      - "11434"
    volumes:
      - cadencia_ollama_data:/root/.ollama
    networks:
      - cadencia_data

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    <<: *hardening
    mem_limit: ${FRONTEND_MEM_LIMIT:-768m}
    logging: *default-logging
    expose:
      - "3000"
    networks:
      - cadencia_edge

  tunnel:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf # cloudflared 2026.7.3, linux/arm64
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - cadencia_edge

networks:
  cadencia_edge:
    name: cadencia_edge
  cadencia_data:
    name: cadencia_data
    internal: true
  cadencia_egress:
    name: cadencia_egress

volumes:
  cadencia_postgres_data:
    name: cadencia_postgres_data
  cadencia_ollama_data:
    name: cadencia_ollama_data
