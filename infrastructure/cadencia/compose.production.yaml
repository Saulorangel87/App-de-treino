name: cadencia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - cadencia_postgres_data:/var/lib/postgresql/data
      - ./initdb/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks:
      - cadencia_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["sh", "/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadencia_data
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      APP_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TOKEN_HOURS: ${EMAIL_TOKEN_HOURS:-24}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
      AI_MODEL: ${AI_MODEL:-qwen3:4b-instruct}
      AI_WORKER_URL: ${AI_WORKER_URL:-}
      AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-220}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadencia_edge
      - cadencia_data

  feedback-digest:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.api
    profiles: ["digest"]
    restart: "no"
    entrypoint: ["/usr/local/bin/cadencia-feedback-digest"]
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FEEDBACK_DIGEST_TO: ${FEEDBACK_DIGEST_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadencia_data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 4g
    cpus: "1.0"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    expose:
      - "11434"
    volumes:
      - cadencia_ollama_data:/root/.ollama
    networks:
      - cadencia_data

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/cadencia/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - cadencia_edge

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - cadencia_edge

networks:
  cadencia_edge:
    name: cadencia_edge
  cadencia_data:
    name: cadencia_data
    internal: true

volumes:
  cadencia_postgres_data:
    name: cadencia_postgres_data
  cadencia_ollama_data:
    name: cadencia_ollama_data
