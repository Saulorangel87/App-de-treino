services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: cadencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadencia_dev}
      POSTGRES_USER: ${POSTGRES_USER:-cadencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cadencia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadencia} -d ${POSTGRES_DB:-cadencia_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadencia_postgres_data:
