version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # Framework em beta: o beta.11 quebrou `vinext start` na imagem de produção.
      # Atualize manualmente, testando a imagem (o job docker do CI cobre isso).
      - dependency-name: "vinext"
      # Saltos de versão maior de toolchain/runtime pedem teste próprio.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infrastructure/cadencia
    schedule: { interval: weekly }
    ignore:
      # Runtime de produção: migrar Node/Go de série é decisão própria, com teste
      # das imagens (o Node 22 é LTS; o Go segue a série do go.mod).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
