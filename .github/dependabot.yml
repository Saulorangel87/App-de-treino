version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # Framework em beta: o beta.11 quebrou `vinext start` na imagem de produção.
      # Atualize manualmente, testando a imagem (o job docker do CI cobre isso).
      - dependency-name: "vinext"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infrastructure/cadencia
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
