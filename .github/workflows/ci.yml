name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod fixa o mínimo (1.25.0), que tem vulnerabilidades da biblioteca
          # padrão já corrigidas em patches posteriores. O CI usa o último patch
          # da série 1.25, o mesmo critério da imagem golang:1.25-alpine.
          go-version: '1.25'
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 -race -cover ./...
      - name: Vulnerabilidades (govulncheck)
        env:
          # O govulncheck atual exige Go >= 1.26 para compilar. O setup-go v7 fixa
          # GOTOOLCHAIN=local; aqui permitimos baixar a toolchain só neste passo.
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cadencia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cadencia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadencia -d cadencia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: cadencia
      PGPASSWORD: ci-only-password
      PGDATABASE: cadencia_ci
    steps:
      - uses: actions/checkout@v7
      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Migrações e fixtures SQL
        run: bash scripts/run-sql-fixtures.sh
      - name: Reaplicar migrações (idempotência)
        run: MIGRATIONS_DIR="$PWD/database/migrations" sh infrastructure/cadencia/scripts/migrate.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        timeout-minutes: 5
        run: npm audit --omit=dev --audit-level=high

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validar YAML, Compose e scripts
        run: |
          python3 -c "import yaml,sys; [yaml.safe_load(open(f)) for f in ['api/openapi.yaml','compose.yaml','infrastructure/cadencia/compose.production.yaml']]"
          sh -n infrastructure/cadencia/scripts/migrate.sh
          bash -n scripts/run-sql-fixtures.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir as imagens de produção
        run: |
          docker build -f infrastructure/cadencia/Dockerfile.api -t cadencia-api-ci .
          docker build -f infrastructure/cadencia/Dockerfile.frontend --build-arg VITE_API_URL=https://api.example.com -t cadencia-frontend-ci .
      - name: O frontend precisa subir e responder
        # Pegaria regressões que só aparecem no runtime da imagem (por exemplo, um
        # vinext novo que falha em `vinext start`), invisíveis para build e testes.
        run: |
          docker run -d --name frontend-ci -p 3000:3000 cadencia-frontend-ci
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/entrar && echo "frontend respondeu" && exit 0
            sleep 2
          done
          docker logs frontend-ci
          exit 1
