<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#eef1ea" />
    <title>Cadência — Sem conexão</title>
    <style>
      :root{color-scheme:light;font-family:'Segoe UI',system-ui,sans-serif;background:#eef1ea;color:#1f231c}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px 16px}.card{width:min(440px,100%);padding:32px 24px;border:1.5px solid #1f231c;background:#f8f9f5;box-shadow:4px 4px 0 #1f231c}.mark{width:44px;height:44px;display:block}h1{margin:22px 0 10px;font-size:30px;line-height:1.1}p{margin:0;color:#3d4438;font-size:16px;line-height:1.55}button{width:100%;min-height:48px;margin-top:24px;border:1.5px solid #1f231c;background:#c3321f;color:#fff;font:inherit;font-weight:700;box-shadow:3px 3px 0 #1f231c;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M23.78 8.22A11 11 0 1 0 23.78 23.78" fill="none" stroke="#1f231c" stroke-width="2.6" stroke-linecap="round"/><path d="M20.18 11.02A6.5 6.5 0 1 0 20.18 20.98" fill="none" stroke="#1f231c" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="#c3321f"/></svg>
      <h1 id="title">Você está sem conexão.</h1>
      <p id="text">Assim que a internet voltar, abra novamente o Cadência para acessar seus dados e seu plano com segurança.</p>
      <button id="retry" type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      // Mesmo cookie de idioma do app (cadencia_lang); sem ele, fica em português.
      if (/(?:^|;\s*)cadencia_lang=en(?:;|$)/.test(document.cookie)) {
        document.documentElement.lang = 'en';
        document.title = 'Cadência — Offline';
        document.getElementById('title').textContent = "You're offline.";
        document.getElementById('text').textContent = 'As soon as the internet is back, open Cadência again to access your data and your plan safely.';
        document.getElementById('retry').textContent = 'Try again';
      }
    </script>
  </body>
</html>
