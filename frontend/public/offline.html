<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102d24" />
    <title>Cadência — Sem conexão</title>
    <style>
      :root{color-scheme:light;font-family:Arial,sans-serif;background:#f5f7f2;color:#14251f}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:36px;border:1px solid #dde4dc;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(20,65,50,.08)}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#102d24;color:#c9f44f;font-size:24px}h1{margin:24px 0 10px;font-family:Georgia,serif;font-size:34px;font-weight:500}p{margin:0;color:#718077;font-size:14px;line-height:1.6}button{width:100%;height:44px;margin-top:26px;border:0;border-radius:10px;background:#164b3a;color:#fff;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">↻</div>
      <h1>Você está sem conexão.</h1>
      <p>Assim que a internet voltar, abra novamente o Cadência para acessar seus dados e seu plano com segurança.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
